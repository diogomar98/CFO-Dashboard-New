name: Official ECB news RSS smoke

on:
  pull_request:
    paths:
      - "src/reported_news_partner.py"
      - "research/smoke_ecb_news_feeds.py"
      - ".github/workflows/public-ecb-news-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-feed-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public HTTP client
        run: python -m pip install requests
      - name: Check official allowlisted RSS feeds without AI credentials
        run: PYTHONPATH=. python research/smoke_ecb_news_feeds.py
