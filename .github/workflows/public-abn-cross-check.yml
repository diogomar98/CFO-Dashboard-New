name: Independent Group NII NIM reconciliation

on:
  pull_request:
    paths:
      - "research/reconcile_2021_nii_nim.py"
      - ".github/workflows/public-abn-cross-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public disclosure reading libraries
        run: python -m pip install requests beautifulsoup4 openpyxl
      - name: Independently reconcile 2021–2026 Group NII and NIM values
        run: python research/reconcile_2021_nii_nim.py
      - name: Export quarter values, exact cell URLs and exception register
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abn-2021-nii-nim-independent-reconciliation
          path: research/2021_reconciliation_output/
          retention-days: 30
          if-no-files-found: warn
