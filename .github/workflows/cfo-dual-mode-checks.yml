name: CFO dual-mode checks

on:
  pull_request:
    paths:
      - "main.py"
      - "src/hud.py"
      - "src/rag.py"
      - "src/real_data_mode.py"
      - "src/reported_brief.py"
      - "src/reported_horizon.py"
      - "src/reported_horizon_engine.py"
      - "src/public_horizon_engine.py"
      - "data/abn_group_nii_nim_2021_public.csv"
      - "data/ecb_dfr_quarterly_2021_public.csv"
      - "src/kpi_sparklines.py"
      - "data/abn_*.csv"
      - "tests/test_dual_mode.py"
      - "tests/test_reported_brief.py"
      - "tests/test_reported_horizon.py"
      - "tests/test_public_horizon.py"
      - ".github/workflows/cfo-dual-mode-checks.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimum runtime packages for source-only checks
        run: python -m pip install "streamlit>=1.38" "pandas>=2.0"
      - name: Compile changed Python and original entry point
        run: python -m py_compile main.py src/hud.py src/rag.py src/real_data_mode.py src/kpi_sparklines.py src/reported_brief.py src/reported_horizon.py src/reported_horizon_engine.py src/public_horizon_engine.py
      - name: Test reported schema, factsheet reconciliation, and mode links
        run: python -m unittest discover -s tests -p "test_*.py" -v
